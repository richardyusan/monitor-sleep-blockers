<?xml version="1.0" encoding="UTF-8"?>
<!-- Monitor Sleep Blockers icon. Copyright (c) 2026 richardyusan. MIT License. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4c9e"/>
      <stop offset="1" stop-color="#1c2257"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="1" stop-color="#f6c945"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="128" height="128" fill="#fff"/>
      <circle cx="70" cy="44" r="30" fill="#000"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="none"
        stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Stars -->
  <circle cx="92" cy="26" r="2.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="102" cy="44" r="1.8" fill="#ffffff" opacity="0.6"/>
  <circle cx="26" cy="96" r="1.8" fill="#ffffff" opacity="0.5"/>

  <!-- Crescent moon -->
  <circle cx="52" cy="58" r="32" fill="url(#moon)" mask="url(#crescent)"/>

  <!-- "Blocked" badge -->
  <circle cx="90" cy="90" r="25" fill="#e01b24" stroke="#1c2257" stroke-width="4"/>
  <circle cx="90" cy="90" r="14" fill="none" stroke="#ffffff" stroke-width="5"/>
  <line x1="80" y1="100" x2="100" y2="80" stroke="#ffffff" stroke-width="5"
        stroke-linecap="round"/>
</svg>
